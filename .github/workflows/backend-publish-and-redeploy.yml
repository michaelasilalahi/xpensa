name: Publish Backend Image and Trigger Dokploy Redeploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-publish-and-redeploy.yml'

jobs:
  publish:
    name: Build and publish backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize repository owner
        id: repo_owner
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo_owner.outputs.owner_lc }}/xpensa/api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  redeploy:
    name: Trigger Dokploy redeployment
    needs: publish
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Trigger Dokploy redeployment
        env:
          DOKPLOY_BASE_URL: ${{ secrets.DOKPLOY_BASE_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          CF_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          : "${DOKPLOY_BASE_URL:?DOKPLOY_BASE_URL secret is required}"
          : "${DOKPLOY_API_KEY:?DOKPLOY_API_KEY secret is required}"
          : "${DOKPLOY_COMPOSE_ID:?DOKPLOY_COMPOSE_ID secret is required}"
          : "${CF_CLIENT_ID:?CF_ACCESS_CLIENT_ID secret is required}"
          : "${CF_CLIENT_SECRET:?CF_ACCESS_CLIENT_SECRET secret is required}"

          BASE_URL="${DOKPLOY_BASE_URL%/}"
          PAYLOAD="$(jq -n \
            --arg composeId "$DOKPLOY_COMPOSE_ID" \
            --arg title "CI Deploy ${GITHUB_SHA:0:7}" \
            --arg description "Triggered by GitHub Actions (${GITHUB_EVENT_NAME}) on ${GITHUB_REF_NAME} (${GITHUB_SHA})" \
            '{composeId: $composeId, title: $title, description: $description}')"

          curl --fail-with-body --silent --show-error --request POST \
            --header "accept: application/json" \
            --header "Content-Type: application/json" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --header "CF-Access-Client-Id: $CF_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_CLIENT_SECRET" \
            --data "$PAYLOAD" \
            "$BASE_URL/api/compose.deploy"
